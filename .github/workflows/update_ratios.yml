name: Update Financial Ratios Weekly

on:
  schedule:
    - cron: '0 2 * * 6'   # 09:00 ICT T7
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests --quiet

      - name: Run fetch_ratios.py
        run: python fetch_ratios.py
        timeout-minutes: 20

      - name: Show results
        run: |
          python3 -c "
          import json
          d = json.load(open('prices.json'))
          valid = {k: v for k, v in d.items() if isinstance(v, dict)}
          pe = sum(1 for v in valid.values() if v.get('pe'))
          pb = sum(1 for v in valid.values() if v.get('pb'))
          print(f'PE={pe} PB={pb} / {len(valid)} ma')
          "

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "📈 Cập nhật ratios PE/PB/ROE $(date +'%d/%m/%Y')"
          git push
