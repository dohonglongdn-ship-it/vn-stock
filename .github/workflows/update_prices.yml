name: Update Stock Prices Daily

on:
  schedule:
    - cron: '30 9 * * 1-5'   # 16:30 ICT T2-T6
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install vnstock requests pandas --quiet

      - name: Run fetch_prices.py
        run: python fetch_prices.py
        timeout-minutes: 25

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "📊 Cập nhật giá $(date +'%d/%m/%Y %H:%M')"
          git push
